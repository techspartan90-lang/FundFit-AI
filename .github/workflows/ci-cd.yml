name: FUND FIT AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: techspartan90-lang/fundfit-ai-backend
  FRONTEND_IMAGE_NAME: techspartan90-lang/fundfit-ai-frontend

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: LINT & AUTOMATED UNIT/INTEGRATION TESTS
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: 🧪 Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite email-validator pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # STAGE 2: CONTAINERIZE & PUSH TO GHCR
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: 🐳 Docker Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # STAGE 3: KUBERNETES ZERO-DOWNTIME ROLLING DEPLOYMENT
  # ---------------------------------------------------------------------------
  deploy-kubernetes:
    name: 🚀 Deploy to Kubernetes Cluster
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f deployment/kubernetes/namespace.yaml
          kubectl apply -f deployment/kubernetes/configmap.yaml
          kubectl apply -f deployment/kubernetes/secrets.yaml
          kubectl apply -f deployment/kubernetes/backend-deployment.yaml
          kubectl apply -f deployment/kubernetes/frontend-deployment.yaml
          kubectl apply -f deployment/kubernetes/ingress.yaml
          kubectl apply -f deployment/kubernetes/hpa.yaml

      - name: Verify Rollout Status & Auto-Rollback on Failure
        run: |
          kubectl rollout status deployment/fundfit-backend-deployment -n fundfit-prod --timeout=120s || kubectl rollout undo deployment/fundfit-backend-deployment -n fundfit-prod
          kubectl rollout status deployment/fundfit-frontend-deployment -n fundfit-prod --timeout=120s || kubectl rollout undo deployment/fundfit-frontend-deployment -n fundfit-prod
