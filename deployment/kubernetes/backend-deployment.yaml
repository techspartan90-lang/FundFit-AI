apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundfit-backend-deployment
  namespace: fundfit-prod
  labels:
    app: fundfit-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fundfit-backend
  template:
    metadata:
      labels:
        app: fundfit-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/techspartan90-lang/fundfit-ai-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fundfit-config
            - secretRef:
                name: fundfit-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fundfit-backend-service
  namespace: fundfit-prod
spec:
  type: ClusterIP
  selector:
    app: fundfit-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
