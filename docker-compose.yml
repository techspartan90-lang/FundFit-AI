version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fundfit_postgres
    restart: always
    environment:
      POSTGRES_DB: fundfit_db
      POSTGRES_USER: fundfit_user
      POSTGRES_PASSWORD: fundfit_password_secure_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundfit_user -d fundfit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 2. CACHE & QUEUE: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fundfit_redis
    restart: always
    command: redis-server --appendonly yes --requirepass redis_password_secure_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_password_secure_123 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 3. BACKEND API: FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: fundfit_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://fundfit_user:fundfit_password_secure_123@postgres:5432/fundfit_db
      REDIS_URL: redis://:redis_password_secure_123@redis:6379/0
      SECRET_KEY: super_secret_jwt_key_production_fundfit_ai_2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 4. CELERY WORKER: Async Background AI & Monte Carlo Tasks
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: fundfit_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://fundfit_user:fundfit_password_secure_123@postgres:5432/fundfit_db
      REDIS_URL: redis://:redis_password_secure_123@redis:6379/0
    depends_on:
      - backend
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 5. FRONTEND: Next.js 15 Container
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: fundfit_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 6. REVERSE PROXY: Nginx Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: fundfit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 7. MONITORING: Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fundfit_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - fundfit_network

  # ---------------------------------------------------------------------------
  # 8. VISUALIZATION: Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fundfit_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin_password_secure_123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fundfit_network

networks:
  fundfit_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
